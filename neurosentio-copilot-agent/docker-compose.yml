

services:
  copilot-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neurosentio-copilot-agent
    ports:
      - "8000:8000"
    volumes:
      # Mount specific source directories for hot-reload in development to avoid 
      # overwriting site-packages or exposing `.env` into the container
      - ./app:/app/app
    environment:
      - DEBUG=true
      - DEFAULT_USER_ID=demo-user
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped
